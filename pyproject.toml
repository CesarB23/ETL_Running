[project]
name = "etl-running"
version = "0.1.0"
description = "Plataforma de datos personal sobre actividades de running de Garmin Connect"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "garmin-connect-personal-api-python>=1.0.0",
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pandera[polars]>=0.20",
    "fitdecode>=0.10",
]

[project.scripts]
etl_running = "etl_running.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_running"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
